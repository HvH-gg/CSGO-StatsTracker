// Install as addons/sourcemod/configs/CSGO-StatsTracker.cfg
"Config"
{
	// Per-server stats key from the HvH.gg server panel.
	"ApiKey"
	{
		"value"		"replace-me"
	}

	// do not change
	"ApiUrl"
	{
		"value"		"https://hvh.gg/api/"
	}

	// a deathmatch is sent in pieces of this many seconds (at least 10)
	"DeathmatchSegmentSeconds"
	{
		"value"		"60"
	}

	// unsent rounds kept for retrying: at most this many, none older than this many minutes,
	// the pause between tries grows from 5 seconds up to RetryMaxDelaySeconds
	"RetryQueueSize"
	{
		"value"		"500"
	}
	"RetryMaxAgeMinutes"
	{
		"value"		"300"
	}
	"RetryMaxDelaySeconds"
	{
		"value"		"300"
	}
}
